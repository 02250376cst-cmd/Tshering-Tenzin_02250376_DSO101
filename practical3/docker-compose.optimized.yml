services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8082:5000"
    depends_on:
      - redis
    networks:
      - app-network
    read_only: true
    cap_drop:
      - ALL
    user: appuser

  redis:
    image: redis:7-alpine
    networks:
      - app-network
    # No read_only or cap_drop for Redis (or keep but test)
    # If you want security, just use:
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

networks:
  app-network: