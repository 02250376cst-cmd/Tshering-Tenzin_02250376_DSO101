name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t my-flask-app:${{ github.sha }} .

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run simple test
        run: |
          echo "def test_app_exists(): assert True" > test_app.py
          pytest test_app.py -v

      - name: Test Docker container
        run: |
          docker build -t test-image .
          docker run -d -p 5000:5000 --name test-container test-image
          sleep 3
          curl -f http://localhost:5000 || exit 1
          docker stop test-container
          docker rm test-container

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to server (simulated)
        run: |
          echo "Deploying application to production server..."
          echo "Would run: docker pull my-flask-app:latest && docker-compose up -d"
          echo "✅ Deployment simulated successfully!"